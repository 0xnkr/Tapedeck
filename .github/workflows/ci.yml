# Builds Tapedeck and runs the tests on every push and pull request; the Android app is built alongside.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # the published app is a Windows .exe, so the tests run where it runs
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # without the Android app: it needs the Android workload and the natives (tools/android-natives.ps1)
      - name: Restore
        run: dotnet restore Tapedeck.Desktop.slnf

      - name: Build
        run: dotnet build Tapedeck.Desktop.slnf --configuration Release --no-restore

      - name: Test
        run: dotnet test Tapedeck.Tests --configuration Release --no-build --logger "console;verbosity=normal"

  android:
    # a build only: it needs no signing key and has no tests of its own (Core and Data are tested above)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the Android workload
        run: dotnet workload install android

      # the downloads are pinned by the script, so its content is the cache key
      - uses: actions/cache@v4
        with:
          path: Tapedeck.Android/natives-cache
          key: android-natives-${{ hashFiles('tools/android-natives.ps1') }}

      - name: Fetch the bundled tools
        shell: pwsh
        run: ./tools/android-natives.ps1

      - name: Build
        run: dotnet build Tapedeck.Android --configuration Debug
